<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<style>
:root{--bg:#f3f5f6;--card:#fff;--ink:#17222d;--mut:#6a7886;--line:#dde3e8;--inc:#1f8a70;--exp:#d1495b;--acc:#2f5d8a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mut:#93a1ae;--line:#2a3743;--inc:#4cc3a3;--exp:#ef7a89;--acc:#7ab0e0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
main{max-width:920px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.05rem;margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 20px}
.top{display:flex;gap:12px;align-items:end;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.sum b{display:block;font-size:1.5rem}.sum span{color:var(--mut);font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.sum b{font-size:1.15rem}}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:10px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{cursor:pointer;border:0;border-radius:6px;padding:10px 14px;background:var(--acc);color:#fff;font-weight:600}
button.ghost{background:none;color:var(--mut);padding:4px 8px;font-weight:400}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{display:grid;grid-template-columns:96px 1fr 76px;gap:8px;align-items:center;margin:8px 0;font-size:.9rem}
.bar i{display:block;height:14px;border-radius:3px;background:var(--exp);min-width:2px}
.bar em{font-style:normal;text-align:right}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:500}.r{text-align:right}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.empty{color:var(--mut);padding:10px 0}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<main>
<div class="top">
  <div><h1>Expense Tracker</h1><p class="sub" style="margin:0">Log income and spending, see where each month’s money went.</p></div>
  <label style="margin:0">Month<input type="month" id="month"></label>
</div>

<div class="sum">
  <div class="card"><span>Income</span><b class="inc" id="sInc">₹0</b></div>
  <div class="card"><span>Expenses</span><b class="exp" id="sExp">₹0</b></div>
  <div class="card"><span>Balance</span><b id="sBal">₹0</b></div>
</div>

<div class="grid">
  <div class="card">
    <h2>Add transaction</h2>
    <div id="f">
      <div class="row2">
        <label>Type<select id="type"><option value="expense">Expense</option><option value="income">Income</option></select></label>
        <label>Amount (₹)<input id="amt" type="number" min="0" step="0.01" inputmode="decimal"></label>
      </div>
      <div class="row2">
        <label>Category<select id="cat"></select></label>
        <label>Date<input id="date" type="date"></label>
      </div>
      <label>Note<input id="note" maxlength="60" placeholder="Optional"></label>
      <button id="add">Add transaction</button>
      <p id="err" class="exp" role="alert" style="margin:8px 0 0;font-size:.9rem"></p>
    </div>
  </div>
  <div class="card">
    <h2>Spending by category</h2>
    <div id="chart"></div>
  </div>
</div>

<div class="card">
  <h2>Transactions</h2>
  <div class="scroll"><table>
    <thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="r">Amount</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div>
</main>
<script>
const CATS={expense:["Food","Transport","Rent","Bills","Shopping","Health","Other"],income:["Salary","Freelance","Gift","Other"]};
const KEY="expense-tracker-v1";
const $=id=>document.getElementById(id);
let tx=[];
try{tx=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tx=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tx))}catch(e){}}
const inr=n=>"₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const today=new Date().toISOString().slice(0,10);
$("date").value=today;$("month").value=today.slice(0,7);
function fillCats(){$("cat").innerHTML=CATS[$("type").value].map(c=>`<option>${c}</option>`).join("")}
fillCats();$("type").onchange=fillCats;$("month").onchange=render;
$("add").onclick=()=>{
  const amount=parseFloat($("amt").value);
  if(!(amount>0)){$("err").textContent="Enter an amount greater than 0.";return}
  if(!$("date").value){$("err").textContent="Pick a date.";return}
  $("err").textContent="";
  tx.push({id:Date.now(),type:$("type").value,amount,cat:$("cat").value,date:$("date").value,note:$("note").value.trim()});
  save();$("amt").value="";$("note").value="";
  $("month").value=$("date").value.slice(0,7);render();
};
function del(id){tx=tx.filter(t=>t.id!==id);save();render()}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  const m=$("month").value;
  const list=tx.filter(t=>t.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const inc=list.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const exp=list.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  $("sInc").textContent=inr(inc);$("sExp").textContent=inr(exp);$("sBal").textContent=inr(inc-exp);
  const by={};list.filter(t=>t.type==="expense").forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),max=ent.length?ent[0][1]:1;
  $("chart").innerHTML=ent.length?ent.map(([c,v])=>`<div class="bar"><span>${c}</span><i style="width:${v/max*100}%"></i><em>${inr(v)}</em></div>`).join(""):'<div class="empty">No expenses this month. Add one to see the breakdown.</div>';
  $("rows").innerHTML=list.length?list.map(t=>`<tr><td>${t.date}</td><td>${t.cat}</td><td>${esc(t.note)}</td><td class="r ${t.type==="income"?"inc":"exp"}">${t.type==="income"?"+":"−"}${inr(t.amount)}</td><td><button class="ghost" onclick="del(${t.id})" aria-label="Delete transaction">Delete</button></td></tr>`).join(""):'<tr><td colspan="5" class="empty">No transactions yet for this month.</td></tr>';
}
render();
</script>
</body>
</html>
